name: standalone3d

services:
  frontend:
    build:
      context: .
      dockerfile: frontend-Dockerfile
      args:
        DOMAIN_NAME_ARG: localhost
        ROOT_DIR_ARG: .
        HTTP_PORT_ARG: $HTTP_PORT
        HTTPS_PORT_ARG: $HTTPS_PORT
        ADMIN_PORT_ARG: $ADMIN_PORT
    volumes:
      - /opt/standalone/web:/cslt/web
  backend:
    ports:
      - "$BACKEND_PORT:$BACKEND_PORT"
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT_ARG: $BACKEND_PORT
    volumes:
      - ./logs/:/cslt/backend/logs
      - /opt/standalone/web:/cslt/web
